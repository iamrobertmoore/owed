<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Owed. Your agent has its own email address. Everything you are owed arrives there, and it goes and gets it. £71.2 billion lost in the UK in one measured year, after everything people recovered.">
  <title>Owed</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F3ED"/>
      <stop offset="1" stop-color="#EAE6DE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F5F1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#paper)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="19.5" fill="none" stroke="#101418" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Mark -->
  <g transform="translate(72 62) scale(1.125)">
    <rect width="64" height="64" rx="14" fill="#101418" />
      <path d="M24 12h16l8 8v20H24z" fill="#F2EFE9" />
      <path d="M40 12v8h8" fill="#101418" opacity="0.25" />
      <path d="M12 24h8v20h28v8H12z" fill="#F2EFE9" />
      <path d="M30 28h12v4H30z" fill="#101418" />
  </g>

  <!-- Wordmark -->
  <text x="168" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#101418">Owed</text>

  <!--
    Three beats, each on its own line and each sized to clear the card at x=792.
    The longest line is 37 characters at 29px, which lands near 540px, so there
    is well over 200px of clearance. The previous version ran to about 1035px and
    the card painted over the end of the sentence.
  -->
  <text x="74" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="600" fill="#101418">Your agent has its own email address.</text>
  <text x="74" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#3A424C">Everything you are owed arrives there,</text>
  <text x="74" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#3A424C">and it goes and gets it.</text>

  <!-- The number, which is the problem and not the solution -->
  <g transform="translate(74 308)">
    <rect x="0" y="0" width="4" height="48" rx="2" fill="#101418"/>
    <text x="22" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#101418">£71.2 billion</text>
    <text x="22" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5A626C">lost in the UK in one measured year, after everything people recovered.</text>
  </g>

  <!--
    A claim, as the product actually shows one.

    The recovered figure is the worked example's own, £349, because the app's
    ledger reads `Recovered £349` for it and this image is the README's first
    screen. The total used to be the sum of both rows on this card, which counted
    the amber one, and amber means still outstanding in the palette the app uses.
    The two rows now add to £409 claimed, of which £349 is recovered and £60 is
    not, which is what the colours say.
  -->
  <g transform="translate(792 68)">
    <path d="M-5 12V270H324" fill="none" stroke="#101418" stroke-opacity="0.10" stroke-width="2"/>
    <rect width="336" height="264" rx="16" fill="url(#card)" stroke="#101418" stroke-opacity="0.10" stroke-width="1.5"/>

    <text x="28" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#69717B">THE LEDGER</text>

    <!-- Claim row: owed -->
    <circle cx="34" cy="82" r="5" fill="#B5761F"/>
    <text x="52" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#101418">Late delivery credit</text>
    <text x="52" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6A727C">their clause 4.2</text>
    <text x="308" y="87" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B5761F">£60</text>

    <!-- Claim row: recovered -->
    <circle cx="34" cy="150" r="5" fill="#0E7C5A"/>
    <text x="52" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#101418">Delayed flight</text>
    <text x="52" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6A727C">settled, they conceded</text>
    <text x="308" y="155" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0E7C5A">£349</text>

    <line x1="28" y1="204" x2="308" y2="204" stroke="#101418" stroke-opacity="0.10" stroke-width="1.5"/>

    <text x="28" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#69717B">RECOVERED</text>
    <text x="308" y="238" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#0E7C5A">£349</text>
  </g>
</svg>
