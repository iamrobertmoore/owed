<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Owed">
  <title>Owed</title>
  <rect width="64" height="64" rx="14" fill="#101418"/>
  <!-- A receipt. The record is the product: what you bought, on what terms. -->
  <path d="M20 12h24a2 2 0 0 1 2 2v34.5l-3.5-2.6-3.5 2.6-3.5-2.6-3.5 2.6-3.5-2.6-3.5 2.6-3.5-2.6V14a2 2 0 0 1 2-2Z" fill="#FAF8F5"/>
  <!-- Two lines of recorded terms. -->
  <rect x="25" y="21" width="14" height="3" rx="1.5" fill="#101418" opacity="0.55"/>
  <rect x="25" y="28" width="9" height="3" rx="1.5" fill="#101418" opacity="0.55"/>
  <!-- The amount. Underlined, because it is the point. -->
  <rect x="25" y="36" width="14" height="4" rx="2" fill="#0E7C5A"/>
  <rect x="25" y="42.5" width="14" height="1.5" rx="0.75" fill="#0E7C5A"/>
</svg>
